services:
  # PostgreSQL - Base de datos
  db:
    image: postgres:16-alpine
    container_name: motorconnect-db
    environment:
      POSTGRES_USER: ${DB_USER:-motorconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
      POSTGRES_DB: ${DB_NAME:-motorconnect_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorconnect -d motorconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motorconnect-net
    restart: unless-stopped

  # Qdrant - Vector Store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: motorconnect-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant-key}
    networks:
      - motorconnect-net
    restart: unless-stopped

  # Redis - Hot Sessions
  redis:
    image: redis:7-alpine
    container_name: motorconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - motorconnect-net
    restart: unless-stopped

  # MongoDB - Chat Logs
  mongodb:
    image: mongo:6-jammy
    container_name: motorconnect-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-motorconnect}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-localdev123}
    ports:
      - "27018:27017" # Map to 27018 on host to avoid port conflicts
    volumes:
      - mongo_data_v2:/data/db
    networks:
      - motorconnect-net
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorconnect-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-prod}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-motorconnect_logs}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - motorconnect-net
    restart: unless-stopped

  # Frontend - React + Nginx
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
    container_name: motorconnect-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    networks:
      - motorconnect-net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  mongo_data:
  mongo_data_v2:

networks:
  motorconnect-net:
    driver: bridge
